version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 16
  pre_build:
    commands:
      - echo Installing dependencies...
      - npm install
  build:
    commands:
      - echo Starting build...
      - npm run build
  post_build:
    commands:
      - echo Build completed at `date`
      - ls -l ./dist

artifacts:
  files:
    - '**/*'
  base-directory: dist
